<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>CampusConnect</h1>
    <p>Student Event Management System</p>
</header>

<section class="hero">
    <h2>Event Registration</h2>
    <p>Register for your favorite college event.</p>
</section>

<section class="event-card">
    <form>
        <label>Student Name:</label><br>
        <input type="text" placeholder="Enter your name"><br><br>

        <label>Email:</label><br>
        <input type="email" placeholder="Enter your email"><br><br>

        <label>Select Event:</label><br>
        <select>
            <option>Tech Hackathon 2026</option>
            <option>AI & Technology Symposium</option>
            <option>Cultural Fest</option>
        </select><br><br>

        <button type="submit">Register</button>
    </form>
</section>

<footer>
    <p>© 2026 CampusConnect | Student Event Management System</p>
</footer>

</body>
</html>
